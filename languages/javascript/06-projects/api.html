<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>project:weather-app</title>
</head>

<body>
  <header>
    <h1>Weather App</h1>
  </header>
  <main>
    <div class="messageSection">
      <p id="errorMessage"></p>
    </div>
    <div class="inputSection">
      <!--Tab to edit-->
      <input type="text" id="userInput" placeholder="Enter city"><br>
      <button id="submitButton">Search</button>
    </div>
    <div id="displaySection">
      <p id="displayCity"></p>
      <p id="displayCountry"></p>
      <p id="displayLatitude"></p>
      <p id="displayLongtitude"></p>
      <p id="displayError"></p>
      <p id="displayTemperature"></p>
      <p id="displayHumidity"></p>
      <p id="displayWindSpeed"></p>
      <p id="displayWindTime"></p>
      <p id="displayWeather"></p>
    </div>

  </main>
  
</body>
<style>
  header{
    display: flex;
    justify-content: center;
  }
  .inputSection{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  input{
    height: 30px;
    width: 200px;
  }
  button{
    background: black;
    color: whitesmoke;
    font-size: 1em;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
  }
  .messageSection{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #displaySection{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #displaySection p{
    color: gray;
    font-size: 1.1em;
  }
</style>

<script>
  
  const userInput = document.querySelector("#userInput");
  const submitButton = document.querySelector("#submitButton");
  const errorMessage = document.querySelector("#errorMessage");
  const displayCity = document.querySelector("#displayCity");
  const displayCountry = document.querySelector("#displayCountry");
  const displayLatitude = document.querySelector("#displayLatitude");
  const displayLongtitude = document.querySelector("#displayLongtitude");
  const displayError = document.querySelector("#displayError");
  const displayTemperature = document.querySelector("#displayTemperature");
  const displayHumidity = document.querySelector("#displayHumidity");
  const displayWindSpeed = document.querySelector("#displayWindSpeed");
  const displayTime = document.querySelector("#displayWindTime");
  const displayWeather = document.querySelector("#displayWeather");
  
  const lastCity = localStorage.getItem("lastCity");

  if (lastCity) {
    geographical(lastCity);
  }

  
  submitButton.addEventListener("click",  ()=>{
    
    const inputCity = userInput.value.trim()
    
    if(inputCity === ""){
      errorMessage.textContent="Input is empty"
      errorMessage.style.color = "red"
      return;
    }
    
    geographical(inputCity);
    
  })
  
  async function geographical(inputCity) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(inputCity)}&count=1`;      
      errorMessage.textContent = "Loading....."  
      errorMessage.style.color = "black"

      displayCity.textContent = "";
      displayCountry.textContent = "";
      displayLatitude.textContent = "";
      displayLongtitude.textContent = "";
      displayError.textContent = "";

      try{
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }   

        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          throw new Error("City not found");
        }

        

        const cityName = data.results[0].name;
        const country = data.results[0].country;
        const latitude = data.results[0].latitude;
        const longitude = data.results[0].longitude;

        displayCity.textContent = `City: ${cityName}`
        displayCountry.textContent = `Country: ${country}`
        displayLatitude.textContent = `Latitute: ${latitude}`
        displayLongtitude.textContent = `Longtitude: ${longitude}`
        
        await forCast(latitude, longitude);

        localStorage.setItem("lastCity", cityName);

        userInput.value = "";

      }
      catch(error){
        console.log(error,"Error")
        errorMessage.textContent = "Failed!"
        errorMessage.style.color = "red"

        displayError.textContent = `Error: ${error.message}`;
        displayTemperature.textContent = "";
        displayHumidity.textContent = "";
        displayWindSpeed.textContent = "";
        displayWeather.textContent = "";
      }

  }

  async function forCast( latitude, longitude ){

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`;

    displayTemperature.textContent = "";
    displayHumidity.textContent = "";
    displayWindSpeed.textContent = "";
    displayWeather.textContent = "";

    const response = await fetch(url);

    if(!response.ok){
      throw new Error(`HTTP Error: ${response.status}`);
    }

    const data = await response.json();

    displayTemperature.textContent = `Temperature: ${Math.round(data.current.temperature_2m)}\u00B0C`;
    displayHumidity.textContent = `Humidity: ${data.current.relative_humidity_2m}%`;
    displayTime.textContent = `Time: ${data.current.time}`;
    displayWindSpeed.textContent = `Wind Speed: ${data.current.wind_speed_10m}km/h`;
    const code =  data.current.weather_code

    const description = getWeatherDescription(code);
    displayWeather.textContent = description; 

    errorMessage.textContent = "success!"
    errorMessage.style.color = "green"
      
  }

  function getWeatherDescription(code) {
    if(code === 0){
      return `Clear sky`
    }
    else if(code === 1){
       return `Mainly clear`
    }
    else if(code === 2){
       return `Partly cloudy`
    }
    else if(code === 3){
       return `Overcast`
    }
    else if(code === 61){
       return `Slight rain`
    }
    else if(code === 63){
       return `Moderate rain`
    }
    else if(code === 65){
       return `Heavy rain`
    }
    else if(code === 95){
       return `Thunderstorm`
    }else{
        return "Unknown weather condition"
    }
}

userInput.addEventListener("keydown", (event)=>{

  const inputCity = userInput.value.trim()

  if(event.key === "Enter"){
    
    if(inputCity === ""){
      errorMessage.textContent="Input is empty"
      errorMessage.style.color = "red"
      return;
    }
    
    geographical(inputCity);

  }
})



  
  
</script>

</html>
