<!DOCTYPE html>

<head>

    <title>Document</title>
</head>

    body{

    }
    main{

        align-items: center;

    }

    }

        font-weight: 400;

    }

        justify-content: center;
        width: 100%;

    }
    .inputContainer{

        height: 100%;
        padding: 3px;

    button{

</html>
